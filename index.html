<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maryam — Keeper of the Shrine</title>
  <meta name="description" content="Portfolio of a computer science graduate. Quests, artifacts, and strange software." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <main>
    <section class="hero">

      <!-- The scene: moon + lynx (decorative) -->
      <div class="hero-scene" aria-hidden="true">
        <div class="moon"></div>

        <div class="lynx">
          <svg viewBox="0 0 200 270" xmlns="http://www.w3.org/2000/svg">
            <g class="lynx-body">
              <!-- bobbed tail -->
              <ellipse cx="172" cy="228" rx="16" ry="20" />
              <!-- haunch -->
              <ellipse cx="128" cy="180" rx="50" ry="62" />
              <!-- chest -->
              <ellipse cx="95"  cy="150" rx="34" ry="42" />
              <!-- head -->
              <ellipse cx="85"  cy="105" rx="33" ry="31" />
              <!-- ears -->
              <path d="M60 92 L50 44 L82 76 Z" />
              <path d="M97 76 L108 40 L120 90 Z" />
              <!-- lynx ear tufts -->
              <path d="M50 44 L42 26 L57 43 Z" />
              <path d="M108 40 L120 26 L114 41 Z" />
              <!-- front legs -->
              <rect x="66" y="160" width="24" height="92" rx="12" />
              <rect x="92" y="170" width="24" height="82" rx="12" />
            </g>
            <!-- eyes -->
            <g class="lynx-eyes">
              <ellipse cx="72" cy="103" rx="6" ry="4" />
              <ellipse cx="96" cy="103" rx="6" ry="4" />
            </g>
          </svg>
        </div>
      </div>

      <!-- The words -->
      <div class="hero-copy">
        <p class="hero-eyebrow">Greetings! it's </p>
        <h1 class="hero-name">Maryam Al Balushi</h1>
        <p class="hero-tagline">
          Computer Science graduate.<br>
          Builder of small worlds and strange software.
        </p>
      </div>

    </section>
  </main>
</body>
</html>
